<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu 10A6 - Câu Đố & Lời Chúc</title>
    <meta name="description" content="Khám phá bộ câu đố vui Trung Thu và lời chúc ý nghĩa dành tặng tập thể lớp 10A6 trong không gian 3D tương tác.">
    <meta property="og:title" content="Trung Thu 10A6 - Câu Đố & Lời Chúc">
    <meta property="og:description" content="Khám phá bộ câu đố vui Trung Thu và lời chúc ý nghĩa dành tặng tập thể lớp 10A6 trong không gian 3D tương tác.">

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Nhấn Space / Phím mũi tên hoặc chạm lồng đèn để xem lần lượt 22 câu đố</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card" id="wishCard">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <div class="quiz-badge" id="quizBadge">Câu 1 / 22</div>
            <h3 id="wishTitle">Câu Đố Trung Thu 10A6</h3>

            <div class="wish-image-container" id="wishImageContainer">
                <img id="wishImage" src="./assets/1.jpg" alt="Hình ảnh Trung Thu 10A6">
            </div>

            <p id="wishText">Đèn gì chỉ thắp một đêm rằm, sáng rực trời đêm?</p>
            <div class="tag" id="wishTag">Đố Vui Trung Thu 10A6</div>

            <div class="modal-nav">
                <button class="nav-btn prev-btn" id="prevQuizBtn" title="Câu trước"><i class="fas fa-chevron-left"></i> Câu trước</button>
                <button class="nav-btn next-btn" id="nextQuizBtn" title="Câu tiếp theo">Câu tiếp theo <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/1.mp3"></audio>
    
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
</body>
</html>
